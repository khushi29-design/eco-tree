# Publish the website on GitHub Pages automatically on every push to `main`.
#
# One-time setup: GitHub → your repository → Settings → Pages → "Build and deployment"
#                 → Source: **GitHub Actions**.  That's all.
#
# The site appears at  https://<your-username>.github.io/<repo-name>/
# The sub-folder (/<repo-name>) is detected automatically, so images, videos, the scroll film
# and all page links work there without any code changes. If you later attach a custom domain
# in Settings → Pages, the sub-folder disappears automatically too.
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables tab):
#   NEXT_PUBLIC_SITE_URL   set to https://www.ecotreelogics.com once Hostinger is live, so Google
#                          treats the Hostinger site as the main one (canonical URLs).
#   NEXT_PUBLIC_FORM_PROVIDER / NEXT_PUBLIC_WEB3FORMS_KEY   GitHub Pages cannot run PHP, so set
#                          these to "web3forms" + your key to make the contact form send from here.
#                          Without them the form shows the email / WhatsApp fallback.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read GitHub Pages address
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || steps.pages.outputs.base_url }}
          NEXT_PUBLIC_FORM_PROVIDER: ${{ vars.NEXT_PUBLIC_FORM_PROVIDER || 'php' }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
          NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_VERIFICATION }}
          NEXT_TELEMETRY_DISABLED: 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
