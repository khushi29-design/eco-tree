# Deploy to Hostinger automatically on every push to the `main` branch (Method A).
#
# One-time setup on GitHub → your repository → Settings → Secrets and variables → Actions → New repository secret:
#   FTP_SERVER    e.g. ftp.ecotreelogics.com   (hPanel → Files → FTP Accounts)
#   FTP_USERNAME  your FTP username
#   FTP_PASSWORD  your FTP password
# Optional (Settings → Secrets → Actions → Variables tab): NEXT_PUBLIC_GA4_ID, NEXT_PUBLIC_GSC_VERIFICATION
#
# Nothing secret is ever stored in the repository itself.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you run it by hand from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.ecotreelogics.com
          NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_VERIFICATION }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload /out to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./public_html/
          # keep any files you added on the server by hand (e.g. email verification files)
          dangerous-clean-slate: false
